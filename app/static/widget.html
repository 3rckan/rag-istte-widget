<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Asistente ISTTE</title>
<style>
  /* Paleta tomada del sitio institucional (istte.edu.ec): azul de marca
     y verde de acento. El panel va pensado para vivir dentro del iframe
     que crea widget-loader.js, por eso ocupa 100% de alto/ancho en vez
     de centrarse en la pagina. */
  :root {
    --istte-azul: #1a3c6e;
    --istte-azul-osc: #12294d;
    --istte-verde: #6fae2e;
    --istte-verde-osc: #5c9424;
    --gris-fondo: #f5f6f8;
    --gris-borde: #e1e3e8;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: transparent;
  }
  #chat-widget {
    height: 100%;
    background: #fff;
    display: flex;
    flex-direction: column;
  }
  #chat-header {
    background: linear-gradient(135deg, var(--istte-azul), var(--istte-azul-osc));
    color: #fff;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  #chat-header-text .titulo {
    font-weight: 600;
    font-size: 15px;
  }
  #chat-header-text .subtitulo {
    font-size: 12px;
    opacity: 0.8;
  }
  #chat-close {
    background: rgba(255,255,255,0.15);
    border: none;
    color: #fff;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #chat-close:hover { background: rgba(255,255,255,0.28); }
  #chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 14px;
    background: var(--gris-fondo);
  }
  .msg {
    margin-bottom: 10px;
    padding: 9px 13px;
    border-radius: 12px;
    max-width: 85%;
    white-space: pre-wrap;
    line-height: 1.4;
    font-size: 14px;
  }
  .msg.user {
    background: var(--istte-azul);
    color: #fff;
    margin-left: auto;
    border-bottom-right-radius: 3px;
  }
  .msg.bot {
    background: #fff;
    color: #222;
    border: 1px solid var(--gris-borde);
    border-bottom-left-radius: 3px;
  }
  .msg.bienvenida {
    background: #fff;
    border: 1px solid var(--gris-borde);
    color: #444;
  }
  .fuentes {
    font-size: 11px;
    color: #6fae2e;
    margin-top: 6px;
    font-weight: 600;
  }
  #chat-form {
    display: flex;
    border-top: 1px solid var(--gris-borde);
    padding: 10px;
    flex-shrink: 0;
    background: #fff;
  }
  #chat-input {
    flex: 1;
    padding: 9px 12px;
    border: 1px solid var(--gris-borde);
    border-radius: 20px;
    font-size: 14px;
    outline: none;
  }
  #chat-input:focus { border-color: var(--istte-azul); }
  #chat-form button {
    margin-left: 8px;
    width: 38px;
    height: 38px;
    background: var(--istte-verde);
    color: #fff;
    border: none;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  #chat-form button:hover { background: var(--istte-verde-osc); }
  #chat-form button:disabled { opacity: 0.6; cursor: default; }
</style>
</head>
<body>

<div id="chat-widget">
  <div id="chat-header">
    <div id="chat-header-text">
      <div class="titulo">Asistente Virtual ISTTE</div>
      <div class="subtitulo">Resuelve tus dudas academicas</div>
    </div>
    <button id="chat-close" type="button" title="Cerrar" aria-label="Cerrar chat">&#10005;</button>
  </div>
  <div id="chat-messages"></div>
  <form id="chat-form">
    <input id="chat-input" type="text" placeholder="Escribe tu pregunta..." autocomplete="off" required>
    <button type="submit" aria-label="Enviar">&#10148;</button>
  </form>
</div>

<script>
  // URL relativa: el widget y el endpoint /query los sirve el mismo backend
  // (en local, http://127.0.0.1:8000; en produccion, el dominio de Render),
  // asi que no hay que tocar esto al desplegar.
  const API_URL = "/query";
  const form = document.getElementById("chat-form");
  const input = document.getElementById("chat-input");
  const messages = document.getElementById("chat-messages");
  const boton = form.querySelector("button");

  function agregarMensaje(texto, tipo, fuentes) {
    const div = document.createElement("div");
    div.className = "msg " + tipo;
    div.textContent = texto;
    if (fuentes && fuentes.length > 0) {
      const f = document.createElement("div");
      f.className = "fuentes";
      f.textContent = "Fuente: " + fuentes.map(s => s.archivo).join(", ");
      div.appendChild(f);
    }
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
    return div;
  }

  agregarMensaje("Hola, soy el asistente virtual del ISTTE. Preguntame sobre reglamentos, calendarios o tramites academicos.", "bienvenida");

  // El boton de cerrar no puede ocultar el iframe desde adentro, asi que
  // le avisa a widget-loader.js (la pagina que lo embebe) por postMessage.
  document.getElementById("chat-close").addEventListener("click", () => {
    window.parent.postMessage({ tipo: "istte-chat-cerrar" }, "*");
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const pregunta = input.value.trim();
    if (!pregunta) return;
    agregarMensaje(pregunta, "user");
    input.value = "";
    boton.disabled = true;
    const pensando = agregarMensaje("Escribiendo...", "bot");

    try {
      const resp = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ pregunta })
      });
      const data = await resp.json();
      pensando.remove();
      agregarMensaje(data.respuesta, "bot", data.fuentes);
    } catch (err) {
      pensando.remove();
      agregarMensaje("Error al conectar con el asistente. Verifica que el servidor este activo.", "bot");
    } finally {
      boton.disabled = false;
      input.focus();
    }
  });
</script>

</body>
</html>
